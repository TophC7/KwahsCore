plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// optional compat layers live in their own srcDir so consuming mods can opt in.
// KwahsCore itself compiles every layer (compileOnly deps below) and ships them
// in the published jar so JarJar embedding still works for mods that need them.
sourceSets.main.java.srcDir 'src/compat/java'

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
}

dependencies {
    // optional compat layer for Sophisticated Storage. Compile-only.
    // Consumers gate every reference behind SSCompat.isLoaded() so the SS-touching
    // classes never link at runtime when SS is absent.
    compileOnly "maven.modrinth:sophisticated-core:${project.sophisticated_core_version}"
    compileOnly "maven.modrinth:sophisticated-storage:${project.sophisticated_storage_version}"
}

// Required for JarJar embedding: jars must declare a module name
tasks.named('jar', Jar) {
    manifest {
        attributes 'Automatic-Module-Name': 'kwahs.core'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
